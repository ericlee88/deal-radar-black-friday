<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deal Radar Live Price Sync</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      width: 340px;
      background: #0b0e14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 15px;
      color: #4ade80;
      letter-spacing: -0.2px;
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .card {
      background: #141821;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }
    .title {
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .price {
      font-size: 20px;
      font-weight: 900;
      color: #4ade80;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .muted {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.35;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: #22c55e;
      color: #052e16;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-sky {
      background: #0ea5e9;
      color: #fff;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .progress-wrap {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.25s ease;
    }
    .status {
      margin-top: 6px;
      font-size: 11.5px;
      color: #38bdf8;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">Deal Radar Sync</span>
    <span class="pill">LOCAL BROWSER</span>
  </div>

  <!-- Active Tab Card -->
  <div id="pageCard" class="card">
    <div class="label">Current Tab</div>
    <div id="pageContent" class="muted">
      Open an Amazon product page or CamelCamelCamel page to sync it in 1 click.
    </div>
    <button id="syncCurrentBtn" class="btn-primary hidden">Save / Update in Deal Radar</button>
    <div id="pageStatus" class="status hidden"></div>
  </div>

  <!-- Watchlist Batch Sync Card -->
  <div class="card">
    <div class="label">Watchlist Batch Price Check</div>
    <div id="watchlistInfo" class="muted">Loading tracked ASINs...</div>
    <div id="progressWrap" class="progress-wrap hidden">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="batchStatus" class="status hidden"></div>
    <button id="syncAllBtn" class="btn-sky">Sync All Live Amazon Prices</button>
    <button id="stopBtn" class="btn-danger hidden">Stop Sync</button>
  </div>

  <button id="openRadarBtn" class="btn-ghost">Open Deal Radar Web App</button>

  <script src="popup.js"></script>
</body>
</html>
