<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deal Radar — Polymorphic Shopping Mission Engine">
  <title>Deal Radar — Flutter + FastAPI Command Center</title>
  <script>
    // Synchronous History API & <base href> shim for blob: iframe environments (Antigravity Local Site Preview)
    (function() {
      if (window.location.protocol === "blob:" && !document.querySelector("base")) {
        const innerOrigin = window.location.href.replace(/^blob:/, "").replace(/\/[^/]*$/, "/");
        if (innerOrigin.startsWith("http://") || innerOrigin.startsWith("https://")) {
          const baseEl = document.createElement("base");
          baseEl.href = innerOrigin;
          document.head.insertBefore(baseEl, document.head.firstChild);
        }
      }
      const origReplaceState = History.prototype.replaceState;
      const origPushState = History.prototype.pushState;
      const origStateDesc = Object.getOwnPropertyDescriptor(History.prototype, "state");
      let _fallbackHistoryState = null;

      History.prototype.replaceState = function(state, title, url) {
        _fallbackHistoryState = state;
        try {
          if (window.location.protocol === "blob:") {
            return origReplaceState.call(this, state, title);
          }
          return origReplaceState.apply(this, arguments);
        } catch (_) {
          try { return origReplaceState.call(this, state, title); } catch (_2) {}
        }
      };
      History.prototype.pushState = function(state, title, url) {
        _fallbackHistoryState = state;
        try {
          if (window.location.protocol === "blob:") {
            return origPushState.call(this, state, title);
          }
          return origPushState.apply(this, arguments);
        } catch (_) {
          try { return origPushState.call(this, state, title); } catch (_2) {}
        }
      };
      if (origStateDesc && origStateDesc.get) {
        Object.defineProperty(History.prototype, "state", {
          configurable: true,
          enumerable: true,
          get: function() {
            try {
              const val = origStateDesc.get.call(this);
              if (val !== null && val !== undefined) return val;
            } catch (_) {}
            return _fallbackHistoryState;
          }
        });
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #090C10;
      color: #E2E8F0;
      font-family: sans-serif;
      height: 100%;
      width: 100%;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #090C10;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    function logStep(msg) {
      const statusEl = document.getElementById("boot-status");
      if (statusEl) statusEl.textContent = msg;
      fetch("api/client-log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ step: msg, href: window.location.href })
      }).catch(function() {});
    }

    window.addEventListener("error", function(e) {
      const dartEx = e.error && e.error.dartException ? String(e.error.dartException) : "";
      logStep("JS Error: " + e.message + " | dartEx=" + dartEx + " | stack=" + (e.error && e.error.stack ? e.error.stack : ""));
    });
    window.addEventListener("unhandledrejection", function(e) {
      logStep("Unhandled Rejection: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
    });

    window.flutterConfiguration = {
      assetBase: ""
    };

    // Synchronously assign window.flutterCanvasKitLoaded before main.dart.js executes.
    // Fetches canvaskit.wasm in 1.6MB chunks (< 4MiB preview proxy ceiling) and reassembles
    // the full binary in memory before calling WebAssembly.instantiate().
    window.flutterCanvasKitLoaded = (async function() {
      try {
        logStep("Loading local CanvasKit WebAssembly (chunked slices)...");
        const chunkUrls = [
          "api/canvaskit/chunk/0",
          "api/canvaskit/chunk/1",
          "api/canvaskit/chunk/2",
          "api/canvaskit/chunk/3",
          "api/canvaskit/chunk/4"
        ];
        const jsPromise = fetch("canvaskit/canvaskit.js").then(function(r) {
          if (!r.ok) throw new Error("canvaskit.js HTTP " + r.status);
          return r.text();
        });
        const chunkPromises = chunkUrls.map(function(u) {
          return fetch(u).then(function(r) {
            if (!r.ok) throw new Error(u + " HTTP " + r.status);
            return r.arrayBuffer();
          });
        });

        const jsText = await jsPromise;
        const chunkBuffers = await Promise.all(chunkPromises);
        let totalBytes = 0;
        for (let i = 0; i < chunkBuffers.length; i++) {
          totalBytes += chunkBuffers[i].byteLength;
        }
        const wasmMerged = new Uint8Array(totalBytes);
        let offset = 0;
        for (let i = 0; i < chunkBuffers.length; i++) {
          wasmMerged.set(new Uint8Array(chunkBuffers[i]), offset);
          offset += chunkBuffers[i].byteLength;
        }
        logStep("Instantiating CanvasKit WASM (" + totalBytes + " bytes)...");

        const cleanJs = jsText
          .replace(/import\.meta\.url/g, '""')
          .replace(/export\s+default\s+CanvasKitInit\s*;?/g, "") + "\nreturn CanvasKitInit;";
        const CanvasKitInit = (new Function(cleanJs))();

        const ck = await CanvasKitInit({
          locateFile: function(file) { return "canvaskit/" + file; },
          instantiateWasm: function(imports, successCallback) {
            WebAssembly.instantiate(wasmMerged, imports).then(function(output) {
              successCallback(output.instance, output.module);
            }).catch(function(err) {
              logStep("WASM instantiate error: " + String(err));
            });
            return {};
          }
        });

        window.flutterCanvasKit = ck;
        logStep("CanvasKit ready (" + totalBytes + " bytes) — starting Flutter engine...");
        return ck;
      } catch (err) {
        logStep("CanvasKit bootstrap error: " + (err && err.stack ? err.stack : String(err)));
        throw err;
      }
    })();

    // Hide boot-loader as soon as <flutter-view> mounts into the DOM
    const observer = new MutationObserver(function() {
      if (document.querySelector("flutter-view")) {
        logStep("Flutter view mounted!");
        const loader = document.getElementById("boot-loader");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(function() { loader.remove(); }, 200);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
  <script src="main.dart.js" defer></script>
</head>
<body>
  <div id="boot-loader">
    <div class="spinner"></div>
    <div id="boot-status" style="font-size: 13px; color: #94A3B8; font-family: monospace;">
      Booting Flutter Web Engine...
    </div>
  </div>
</body>
</html>
