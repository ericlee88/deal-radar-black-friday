name: Deploy Deal Radar to GitHub Pages

on:
  push:
    branches:
      - main
      - feat/github-pages-static-sync
  schedule:
    # Automatically refresh live prices via Gemini Search Grounding / Keepa every 6 hours (runs on default branch)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v4

      - name: Poll Live Prices & Export Static Snapshot
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRICE_PROVIDER: ${{ secrets.KEEPA_API_KEY != '' && 'keepa' || 'amazon_direct' }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          WEBHOOK_PROVIDER: ${{ secrets.WEBHOOK_PROVIDER || 'none' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv sync
          if [ -n "$GEMINI_API_KEY" ]; then
            uv run python scripts/gemini_search_prices.py || true
          fi
          uv run python scripts/export_snapshot.py --poll

      - name: Commit Updated Verified Price History (Scheduled / Manual Runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "deal-radar-bot@users.noreply.github.com"
          git add data/verified_prices.json frontend/web/data/deals_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified Black Friday prices [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Web for GitHub Pages
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --dart-define=PUBLIC_WORKER_URL=${{ vars.PUBLIC_WORKER_URL }}
          touch build/web/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
